version: '3'

services:
  web:
    build: .
    working_dir: /usr/src/app
    env_file:
     - .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - app-data:/usr/src/app
    command: air ./cmd/main.go -b 0.0.0.0
    depends_on:
      - db
    restart: always
    networks:
      - app-network
  db:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-db:/var/lib/postgresql/data
    restart: always
    networks:
      - app-network

volumes:
  postgres-db:
  app-data:

networks:
  app-network:
